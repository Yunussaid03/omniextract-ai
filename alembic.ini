# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# sys.path path, inserted to sys.path if present.
prepend_sys_path = .

sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/omniextract_db

[post_write_hooks]

[loggers]
keys = root, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
